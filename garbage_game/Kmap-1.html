<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>卡諾圖大師 - 終極群組挑戰</title>
  <style>
    :root {
      --primary: #3498db;
      --success: #2ecc71;
      --danger: #e74c3c;
      --warning: #f39c12;
      --dark: #2c3e50;
      --light: #ecf0f1;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: var(--dark);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    header {
      background: var(--dark);
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 10px;
      background: linear-gradient(45deg, #ff6b6b, #feca57);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 1.2em;
      opacity: 0.9;
      margin-bottom: 20px;
    }

    .game-info {
      display: flex;
      justify-content: space-around;
      background: var(--light);
      padding: 15px;
      border-bottom: 3px solid var(--primary);
    }

    .info-item {
      text-align: center;
    }

    .info-value {
      font-size: 1.5em;
      font-weight: bold;
      color: var(--primary);
    }

    .difficulty-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      padding: 30px;
      background: #f8f9fa;
    }

    .difficulty-btn {
      padding: 20px;
      border: none;
      border-radius: 15px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .difficulty-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: left 0.5s;
    }

    .difficulty-btn:hover::before {
      left: 100%;
    }

    .difficulty-btn.easy { background: var(--success); color: white; }
    .difficulty-btn.medium { background: var(--primary); color: white; }
    .difficulty-btn.hard { background: var(--warning); color: white; }
    .difficulty-btn.hell { background: var(--danger); color: white; }

    .difficulty-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    #game.grid {
      display: grid;
      gap: 4px;
      justify-content: center;
      margin: 30px auto;
      padding: 20px;
      max-width: fit-content;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .cell {
      width: 60px;
      height: 60px;
      background: linear-gradient(145deg, #e3e3e3, #fefefe);
      border: 3px solid #bdc3c7;
      border-radius: 12px;
      font-size: 1.4em;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .cell:hover {
      transform: scale(1.05);
      border-color: var(--primary);
      box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
    }

    .cell.correct {
      background: linear-gradient(145deg, #a8e6a8, #d4fcd4);
      border-color: var(--success);
      color: #27ae60;
      animation: pulse 0.6s ease;
    }

    .cell.wrong {
      background: linear-gradient(145deg, #ffb8b8, #ffd4d4);
      border-color: var(--danger);
      color: #c0392b;
      animation: shake 0.5s ease;
    }

    .cell.zero {
      color: #95a5a6;
      background: #f8f9fa;
      cursor: not-allowed;
    }

    .cell.donut {
      background: conic-gradient(
        #3498db 0% 25%,
        #e74c3c 25% 50%,
        #f39c12 50% 75%,
        #2ecc71 75% 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 900;
    }

    .cell.x-mark {
      color: #7f8c8d;
      font-style: italic;
      background: #fefefe;
    }

    .controls {
      padding: 20px;
      text-align: center;
      background: var(--light);
      border-top: 3px solid var(--primary);
    }

    .btn {
      padding: 15px 30px;
      margin: 0 10px;
      border: none;
      border-radius: 25px;
      font-size: 1.1em;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      background: var(--primary);
      color: white;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 15px rgba(0,0,0,0.2);
    }

    .btn-success { background: var(--success); }
    .btn-warning { background: var(--warning); }

    #result {
      padding: 30px;
      text-align: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      margin-top: 20px;
      border-radius: 0 0 20px 20px;
    }

    .result-content {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
    }

    .achievement {
      font-size: 4em;
      margin-bottom: 20px;
      animation: bounce 1s ease infinite;
    }

    .combo-counter {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--warning);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .tutorial {
      background: var(--light);
      padding: 20px;
      margin: 20px;
      border-radius: 15px;
      border-left: 5px solid var(--primary);
    }

    .group-size {
      font-size: 1.2em;
      color: var(--primary);
      font-weight: bold;
      margin: 10px 0;
    }
  </style>
</head> 
<body>
  <div class="container"> 
    <header>
      <h1>🎯 卡諾圖大師</h1>
      <div class="subtitle">找出合法的 1 群組，成為布林代數專家！</div>
    </header>

    <div class="game-info">
      <div class="info-item">
        <div>完成時間</div>
        <div class="info-value" id="timer">0.00s</div>
      </div>
      <div class="info-item">
        <div>找到群組</div>
        <div class="info-value" id="groupsFound">0</div>
      </div>
      <div class="info-item">
        <div>準確率</div>
        <div class="info-value" id="accuracy">100%</div>
      </div>
    </div>

    <div id="menu">
      <div class="tutorial">
        <h3>🎮 遊戲規則</h3>
        <p>選擇相鄰的 <span class="group-size">4 個值為 1 的格子</span>組成合法矩形群組！</p>
        <p>💡 <strong>提示：</strong> 群組必須是同一行或同一列的連續格子</p>
      </div>

      <div class="difficulty-buttons">
        <button class="difficulty-btn easy" onclick="startGame('easy')">
          🟢 新手訓練 (2×2)
        </button>
        <button class="difficulty-btn medium" onclick="startGame('medium')">
          🔵 進階挑戰 (2×4)
        </button>
        <button class="difficulty-btn hard" onclick="startGame('hard')">
          🟠 專家模式 (4×4)
        </button>
        <button class="difficulty-btn hell" onclick="startGame('hell')">
          🔴 地獄難度 (4×8)
        </button>
      </div>
    </div>

    <div id="game" class="grid"></div>

    <div class="controls">
      <button class="btn btn-warning" onclick="showHint()">💡 提示</button>
      <button class="btn" onclick="restartGame()">🔄 重新開始</button>
      <button class="btn btn-success" onclick="checkSolution()">✅ 檢查答案</button>
    </div>

    <div id="result"></div>
  </div>

  <script>
    let grid = [];//很詭異你知道嗎，用C++雖然可能更容易但我不想搞封裝
    let clicked = [];
    let selectedCells = [];
    let rows = 2, cols = 2;
    let groupsFound = 0;
    let totalGroups = 0;
    let startTime = 0;
    let timerInterval;
    let correctAttempts = 0;
    let totalAttempts = 0;
    let currentLevel = '';

    const cellTypes = {
      0: { class: 'zero', text: '0' },
      1: { class: '', text: '1' },
      'X': { class: 'x-mark', text: 'X' },
      'D': { class: 'donut', text: '🎯' }
    };

    function startGame(level) {
      currentLevel = level;
      resetGame();
      document.getElementById('menu').style.display = 'none';
      
      switch(level) {
        case 'easy': rows = 2; cols = 2; break;
        case 'medium': rows = 2; cols = 4; break;
        case 'hard': rows = 4; cols = 4; break;
        case 'hell': rows = 4; cols = 8; break;
      }

      generateGrid();
      startTimer();
      updateStats();
    }

    function resetGame() {
      groupsFound = 0;
      correctAttempts = 0;
      totalAttempts = 0;
      selectedCells = [];
      clearInterval(timerInterval);
      document.getElementById('timer').textContent = '0.00s';
      document.getElementById('groupsFound').textContent = '0';
      document.getElementById('accuracy').textContent = '100%';
    }

    function generateGrid() {
      const gameDiv = document.getElementById('game');
      gameDiv.innerHTML = '';
      gameDiv.style.gridTemplateColumns = `repeat(${cols}, 60px)`;
      
      grid = [];
      clicked = [];
      totalGroups = 0;

      // 生成基礎網格
      for (let r = 0; r < rows; r++) {
        grid[r] = [];
        clicked[r] = [];
        for (let c = 0; c < cols; c++) {
          const rand = Math.random();
          let type = '0';
          
          if (rand < 0.4) type = '0';
          else if (rand < 0.8) type = '1';
          else if (rand < 0.95) type = 'X';
          else type = 'D';

          grid[r][c] = type;
          clicked[r][c] = false;
        }
      }

      // 確保有足夠的 1
      ensureMinimumOnes();
      renderGrid();
    }

    function ensureMinimumOnes() {
      let onesCount = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c] === '1') onesCount++;
        }
      }

      const minOnes = Math.max(8, rows * cols * 0.3);
      if (onesCount < minOnes) {
        // 隨機將一些 0 轉為 1
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            if (grid[r][c] === '0' && Math.random() < 0.3 && onesCount < minOnes) {
              grid[r][c] = '1';
              onesCount++;
            }
          }
        }
      }
    }

    function renderGrid() {
      const gameDiv = document.getElementById('game');
      gameDiv.innerHTML = '';

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const type = grid[r][c];
          const cellInfo = cellTypes[type];
          
          const cell = document.createElement('div');
          cell.className = `cell ${cellInfo.class}`;
          cell.textContent = cellInfo.text;
          cell.dataset.row = r;
          cell.dataset.col = c;

          if (type === '1') {
            cell.onclick = () => cellClicked(cell, r, c);
          } else {
            cell.style.cursor = 'not-allowed';
          }

          gameDiv.appendChild(cell);
        }
      }
    }

    function cellClicked(cell, r, c) {
      if (selectedCells.length >= 4 || clicked[r][c]) return;

      selectedCells.push({ r, c, cell });
      cell.classList.add('correct');
      cell.style.transform = 'scale(1.1)';

      if (selectedCells.length === 4) {
        setTimeout(() => validateGroup(selectedCells), 300);
      }
    }

    function validateGroup(cells) {
      totalAttempts++;
      const rs = cells.map(c => c.r);
      const cs = cells.map(c => c.c);

      const sameRow = rs.every(r => r === rs[0]);
      const sameCol = cs.every(c => c === cs[0]);

      const sortedRows = [...rs].sort((a, b) => a - b);
      const sortedCols = [...cs].sort((a, b) => a - b);

      const consecutiveRow = sortedRows.every((r, i, arr) => i === 0 || r === arr[i - 1] + 1);
      const consecutiveCol = sortedCols.every((c, i, arr) => i === 0 || c === arr[i - 1] + 1);

      const isValidGroup = (sameRow && consecutiveCol) || (sameCol && consecutiveRow);

      if (isValidGroup) {
        correctAttempts++;
        groupsFound++;
        cells.forEach(c => {
          clicked[c.r][c.c] = true;
          c.cell.style.background = 'linear-gradient(145deg, #a8e6a8, #d4fcd4)';
          c.cell.style.borderColor = '#27ae60';
          c.cell.style.transform = 'scale(1)';
          c.cell.onclick = null;
        });
        showComboEffect();
      } else {
        cells.forEach(c => {
          c.cell.classList.add('wrong');
          c.cell.style.transform = 'scale(1)';
          setTimeout(() => {
            c.cell.classList.remove('wrong', 'correct');
            c.cell.style.background = '';
            c.cell.style.borderColor = '';
          }, 1000);
        });
      }

      selectedCells = [];
      updateStats();
      checkEnd();
    }

    function showComboEffect() {
      const combo = document.createElement('div');
      combo.className = 'combo-counter';
      combo.textContent = `🔥 Combo: ${groupsFound}`;
      combo.style.position = 'fixed';
      combo.style.top = '20px';
      combo.style.right = '20px';
      combo.style.zIndex = '1000';
      
      document.body.appendChild(combo);
      
      setTimeout(() => {
        combo.style.transition = 'all 0.5s ease';
        combo.style.opacity = '0';
        combo.style.transform = 'translateY(-20px)';
        setTimeout(() => combo.remove(), 500);
      }, 1000);
    }

    function startTimer() {
      startTime = Date.now();
      timerInterval = setInterval(() => {
        const elapsed = ((Date.now() - startTime) / 1000).toFixed(2);
        document.getElementById('timer').textContent = `${elapsed}s`;
      }, 100);
    }

    function updateStats() {
      document.getElementById('groupsFound').textContent = groupsFound;
      const accuracy = totalAttempts === 0 ? 100 : Math.round((correctAttempts / totalAttempts) * 100);
      document.getElementById('accuracy').textContent = `${accuracy}%`;
    }

    function checkEnd() {
      let onesLeft = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c] === '1' && !clicked[r][c]) onesLeft++;
        }
      }

      if (onesLeft === 0) {
        clearInterval(timerInterval);
        showVictoryScreen();
      }
    }

    function showVictoryScreen() {
      const endTime = Date.now();
      const timeTaken = ((endTime - startTime) / 1000).toFixed(2);
      const accuracy = Math.round((correctAttempts / totalAttempts) * 100);
      
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = `
        <div class="result-content">
          <div class="achievement">🏆</div>
          <h2>關卡完成！</h2>
          <div class="stats">
            <p>⏱️ 完成時間: <strong>${timeTaken}秒</strong></p>
            <p>🎯 準確率: <strong>${accuracy}%</strong></p>
            <p>⭐ 找到群組: <strong>${groupsFound}個</strong></p>
          </div>
          <p>簡化後的布林表達式:</p>
          <div class="boolean-expr">${generateBooleanExpr()}</div>
          <button class="btn" onclick="restartGame()" style="margin-top: 20px;">
            🎮 再玩一次
          </button>
        </div>
      `;
    }

    function generateBooleanExpr() {
      const vars = ['A', 'B', 'C', 'D'];
      let terms = [];

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const val = grid[r][c];
          if (val === '1' || val === 'X') {
            let term = '';
            if (rows > 2) {
              term += (r & 2 ? vars[0] : vars[0] + "'") + (r & 1 ? vars[1] : vars[1] + "'");
            }
            if (cols > 2) {
              if (term) term += "·";
              term += (c & 2 ? vars[2] : vars[2] + "'") + (c & 1 ? vars[3] : vars[3] + "'");
            }
            if (val === 'X') {
              term += ' (無關項)';
            }
            terms.push(term);
          }
        }
      }

      return terms.length > 0 ? terms.join(" + ") : "0";
    }

    function showHint() {
      alert('💡 提示：尋找同一行或同一列中連續的4個1，組成矩形區域！');
    }

    function checkSolution() {
      alert('🔍 檢查答案功能開發中...');
    }

    function restartGame() {
      document.getElementById('result').innerHTML = '';
      document.getElementById('menu').style.display = 'block';
      document.getElementById('game').innerHTML = '';
      resetGame();
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', () => {
      console.log('🎯 卡諾圖大師已載入！');
    });
  </script>
</body>
</html>
